name: Windows installer package checks
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: 'Windows workflow run with a successful build job; reuse its exact package'
        type: string
        required: true
      rebuild_installer:
        description: 'Compile the current installer template over unchanged application bits'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
env:
  PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
  REBUILD_INSTALLER: ${{ inputs.rebuild_installer }}
jobs:
  installer:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify package source and build success
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = [long]::Parse($env:PACKAGE_RUN_ID)
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.path -ne '.github/workflows/windows.yml') { throw 'Package must come from the Windows workflow' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/jobs?filter=all&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -or -not @($jobs.jobs | Where-Object { $_.name -eq 'build' -and $_.conclusion -eq 'success' }).Count) { throw 'Package build must have passed' }
          git fetch --no-tags origin $run.head_sha
          if ($LASTEXITCODE) { throw 'Could not fetch package source' }
          $protected = @('src', 'worker', 'Directory.Build.props', 'Directory.Build.targets', 'Directory.Packages.props', 'global.json', 'scripts/build-windows.ps1', 'scripts/collect-licenses.ps1', 'scripts/deps.lock', 'scripts/patches', 'scripts/fetch-deps.ps1', 'scripts/fetch-deps.sh', '.github/workflows/windows.yml')
          if ($env:REBUILD_INSTALLER -ne 'true') { $protected += @('installer', 'scripts/build-installer.ps1') }
          $changed = git diff --name-only $run.head_sha HEAD -- @protected
          if ($LASTEXITCODE -or $changed) { throw 'Application/installer build inputs changed; run the full Windows build' }
          New-Item -ItemType Directory installer-check | Out-Null
          @{ packageRun = $runId; packageSource = $run.head_sha; harnessSource = $env:GITHUB_SHA; rebuiltInstaller = $env:REBUILD_INSTALLER; scope = 'Verified prebuilt application; current installer if requested, and current test harness. Not a full source build/native acceptance run.' } | ConvertTo-Json | Set-Content installer-check/provenance.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfMetaStudio-win-x64
          path: dist/PdfMetaStudio
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfMetaStudio-installer-win-x64
          path: dist/installer
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfMetaStudio-installer-test-baseline
          path: build/installer-baseline
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfMetaStudio-native-test-tools-win-x64
          path: build/native-tools
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Compile current installer over unchanged application bits
        if: ${{ env.REBUILD_INSTALLER == 'true' }}
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Prepare isolated desktop and checked-in fixture
        shell: powershell
        run: |
          ./scripts/prepare-windows-desktop.ps1 -OutDir installer-check
          ./scripts/windows-host-info.ps1 -OutDir installer-check -Exe "$PWD/dist/PdfMetaStudio/PdfMetaStudio.exe" -RequireWindows11Arm
          if (-not (Test-Path tests/fixtures/rich.pdf)) { throw 'Checked-in PDF fixture missing' }
      - name: Reproduce the managed-test context before installation
        shell: pwsh
        run: |
          $env:PDFMETA_WORKER = "$PWD/dist/PdfMetaStudio/pdfmeta-worker.exe"
          $env:PDFMETA_TEST_WORKER = "$PWD/build/native-tools/pdfmeta-test-worker.exe"
          dotnet test tests/PdfMetaStudio.Core.Tests -c Release --logger 'trx;LogFileName=core-tests.trx' --results-directory installer-check
          if ($LASTEXITCODE) { throw 'Managed test context failed' }
      - name: Wizard, install, installed editor and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Upgrade, reinstall, downgrade refusal and document retention
        shell: pwsh
        run: ./scripts/test-installer-upgrade.ps1
      - name: Legacy MSI isolation
        shell: pwsh
        run: ./scripts/test-installer-legacy-msi.ps1
      - name: Transient owned-file lock and unowned document preservation
        shell: pwsh
        run: ./scripts/test-installer-file-lock.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installer-check
          path: |
            installer-check
            installer-*.log
            installer-*.json
            installer-smoke
            installer-upgrade
            installer-legacy
            installer-file-lock
