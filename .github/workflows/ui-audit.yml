name: Windows UI audit
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: 'Successful windows workflow run supplying the unchanged native worker'
        type: string
        required: true
        default: '37729944353'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify native package provenance
        shell: pwsh
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = [long]::Parse($env:PACKAGE_RUN_ID)
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/windows.yml') { throw 'Native package must come from a successful Windows workflow in this repository' }
          git fetch --no-tags origin $run.head_sha
          if ($LASTEXITCODE) { throw 'Could not fetch native package source' }
          $changed = git diff --name-only $run.head_sha HEAD -- worker scripts/deps.lock scripts/patches scripts/fetch-deps.ps1 scripts/build-windows.ps1
          if ($LASTEXITCODE -or $changed) { throw 'Native source/build inputs changed; run a full Windows build before reusing this package' }
          New-Item -ItemType Directory ui-audit -Force | Out-Null
          @{ runId = $runId; sourceCommit = $run.head_sha; currentCommit = $env:GITHUB_SHA; scope = 'Reused native worker; managed application and audit harness are rebuilt from current source' } | ConvertTo-Json | Set-Content ui-audit/native-provenance.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PdfMetaStudio-win-x64
          path: dist/PdfMetaStudio
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
      - name: Build current managed application and audit harness
        id: build
        shell: pwsh
        run: |
          dotnet publish src/PdfMetaStudio.App -c Release -r win-x64 --self-contained true -o dist/PdfMetaStudio
          if ($LASTEXITCODE) { throw 'Managed application build failed' }
          dotnet publish tests/PdfMetaStudio.UiAudit -c Release -r win-x64 --self-contained true -o build/ui-audit
          if ($LASTEXITCODE) { throw 'UI audit harness build failed' }
      - name: Prepare Windows desktop and synthetic fixtures
        id: prepare
        shell: powershell
        run: |
          ./scripts/prepare-windows-desktop.ps1 -OutDir ui-audit
          ./scripts/windows-host-info.ps1 -OutDir ui-audit -Exe "$PWD/dist/PdfMetaStudio/PdfMetaStudio.exe" -RequireWindows11Arm
          python -c "import sys,pathlib; sys.path.insert(0,'worker/tests'); import pdfgen; p=pathlib.Path('build/acceptance-fixtures'); p.mkdir(parents=True,exist_ok=True); (p/'rich.pdf').write_bytes(pdfgen.make_pdf()); (p/'audit-rich.pdf').write_bytes(pdfgen.make_pdf(info={'Title':'Audit title','Author':'Audit author'},page_meta=[0]))"
          if ($LASTEXITCODE) { throw 'Synthetic fixture generation failed' }
          python scripts/generate-acceptance-fixtures.py build/acceptance-fixtures
          if ($LASTEXITCODE) { throw 'Stress fixture generation failed' }
      - name: Existing keyboard, calendar, theme, resizing and stress acceptance
        timeout-minutes: 12
        shell: pwsh
        env:
          GUI_ENGINE_PACKAGE_RUN: ${{ inputs.package_run_id }}
        run: ./scripts/windows-acceptance.ps1 -Exe "$PWD/dist/PdfMetaStudio/PdfMetaStudio.exe" -Pdf "$PWD/build/acceptance-fixtures/rich.pdf" -StressPdf "$PWD/build/acceptance-fixtures/stress.pdf" -OutDir "$PWD/ui-audit/acceptance" -CalendarChecks
      - name: Additional draft, accessibility, contrast and layout checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.prepare.outcome == 'success' }}
        timeout-minutes: 4
        shell: pwsh
        env:
          GUI_ENGINE_PACKAGE_RUN: ${{ inputs.package_run_id }}
        run: |
          ./scripts/test-ui-audit.ps1 -Exe "$PWD/build/ui-audit/PdfMetaStudio.UiAudit.exe" -Pdf "$PWD/build/acceptance-fixtures/audit-rich.pdf" -Worker "$PWD/dist/PdfMetaStudio/pdfmeta-worker.exe" -OutDir "$PWD/ui-audit/additional"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-ui-audit
          path: ui-audit
