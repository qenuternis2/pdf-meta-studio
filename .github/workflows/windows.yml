name: windows
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Создать релиз с этим тегом (например v0.1.0); пусто — только сборка'
        required: false
        default: ''
      gui_only:
        description: 'Run GUI acceptance using a previously built native worker; skips native/MSI acceptance'
        type: boolean
        default: false
      desktop_probe:
        description: 'Inspect Windows 11 desktop blockers without building or running application tests'
        type: boolean
        default: false
      package_run_id:
        description: 'Successful run containing PdfMetaStudio-win-x64 (required for GUI-only mode)'
        type: string
        default: ''
# Сборке нужен только доступ на чтение репозитория.
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.gui_only && !inputs.desktop_probe }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Desktop preparation regression checks
        shell: powershell
        run: |
          & powershell.exe -NoProfile -File ./tests/scripts/PrepareWindowsDesktop.Tests.ps1
          exit $LASTEXITCODE
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pypdf==6.19.0 cryptography==50.0.2
      - name: vcpkg (baseline from worker/vcpkg.json)
        shell: pwsh
        run: |
          $baseline = (Get-Content worker/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone --quiet https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout --quiet $baseline
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1 *>&1 | Tee-Object -FilePath build.log
      # Журнал задания не всегда доступен снаружи; хвост и строки с ошибками попадают в аннотацию.
      - name: Report build log
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { exit 0 }
          $errs = Select-String -Path build.log -Pattern 'error|FAIL|fatal|Exception' | Select-Object -First 40 | ForEach-Object { $_.Line }
          $tail = Get-Content build.log -Tail 60
          $msg = (@($errs) + '----- tail -----' + @($tail)) -join "`n"
          $msg = $msg.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Output "::error title=build log::$msg"
      # Итоги тестов в аннотации: журнал задания не всегда доступен снаружи.
      - name: Report test summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { exit 0 }
          $log = Get-Content build.log
          $count = { param($p) @($log | Where-Object { $_ -match $p }).Count }
          $lines = @(
            "worker e2e: PASS $(& $count '^PASS ') / SKIP $(& $count '^SKIP ') / FAIL $(& $count '^FAIL ')")
          $lines += @($log | Where-Object { $_ -match '^(SKIP|FAIL) |^CORPUS|Passed!|Failed!|LNK4098|PdfMetaStudio.exe' })
          $msg = ($lines -join "`n").Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Output "::notice title=test summary::$msg"
      - name: GUI smoke test (UI Automation)
        id: gui
        shell: powershell
        run: |
          & .\scripts\gui-smoke.ps1 -Exe "$PWD\dist\PdfMetaStudio\PdfMetaStudio.exe" -Pdf "$PWD\tests\fixtures\rich.pdf" -OutDir "$PWD\gui-smoke"
          exit $LASTEXITCODE
      - name: Report GUI smoke
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path gui-smoke/gui-smoke.log)) { exit 0 }
          $msg = ((Get-Content gui-smoke/gui-smoke.log -Encoding utf8) -join "`n").Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Output "::notice title=gui smoke::$msg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gui-smoke-screenshots
          path: gui-smoke
      - name: Install, exercise and uninstall the per-user MSI
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Keyboard, theme, resize and large-data acceptance
        timeout-minutes: 12
        shell: pwsh
        run: |
          python scripts/generate-acceptance-fixtures.py build/acceptance-fixtures
          if ($LASTEXITCODE) { throw 'Acceptance fixture generation failed' }
          ./scripts/windows-acceptance.ps1 -Exe "$PWD/dist/PdfMetaStudio/PdfMetaStudio.exe" -Pdf "$PWD/tests/fixtures/rich.pdf" -StressPdf "$PWD/build/acceptance-fixtures/stress.pdf" -OutDir "$PWD/windows-acceptance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-acceptance
          path: windows-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installer-acceptance
          path: |
            installer-*.log
            installer-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PdfMetaStudio-installer-win-x64
          path: dist/installer/*.msi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PdfMetaStudio-win-x64
          path: dist/PdfMetaStudio
      - name: Collect native test tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/native-tools -Force | Out-Null
          Copy-Item build/worker/Release/pdfmeta-test-worker.exe build/native-tools
          Copy-Item build/worker/Release/pdfmeta-fileutil-tests.exe build/native-tools
          $qpdf = Get-ChildItem build/worker/qpdf -Recurse -Filter qpdf.exe | Select-Object -First 1
          if (-not $qpdf) { throw 'Native qpdf test tool missing' }
          Copy-Item $qpdf.FullName build/native-tools/qpdf.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PdfMetaStudio-native-test-tools-win-x64
          path: build/native-tools
  windows11:
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Desktop preparation regression checks
        shell: powershell
        run: |
          & powershell.exe -NoProfile -File ./tests/scripts/PrepareWindowsDesktop.Tests.ps1
          exit $LASTEXITCODE
      - name: Report actual Windows product and architecture
        shell: pwsh
        run: Get-ComputerInfo | Select-Object WindowsProductName, OsArchitecture, OsBuildNumber
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: pip install pypdf==6.19.0 cryptography==50.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PdfMetaStudio-win-x64
          path: dist/PdfMetaStudio
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PdfMetaStudio-installer-win-x64
          path: dist/installer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PdfMetaStudio-native-test-tools-win-x64
          path: build/native-tools
      - name: Record Windows 11 ARM host and x64 application identity
        shell: powershell
        run: |
          ./scripts/prepare-windows-desktop.ps1 -OutDir windows11-acceptance
          ./scripts/windows-host-info.ps1 -OutDir windows11-acceptance -Exe "$PWD/dist/PdfMetaStudio/PdfMetaStudio.exe" -RequireWindows11Arm
      - name: Install pinned independent page renderer for native tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'pdfmeta-poppler-26.09.zip'
          $source = 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip'
          $expectedHash = '7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0'
          Invoke-WebRequest -Uri $source -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Poppler archive SHA-256 mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'pdfmeta-poppler'
          Expand-Archive $archive $tools
          $renderer = Get-ChildItem $tools -Recurse -Filter pdftoppm.exe | Select-Object -First 1
          if (-not $renderer) { throw 'Independent page renderer missing' }
          $version = @(& $renderer.FullName -v 2>&1 | ForEach-Object { "$_" })
          if ($LASTEXITCODE) { throw 'Independent page renderer failed to start' }
          $renderer.Directory.FullName >> $env:GITHUB_PATH
          @{ source = $source; sha256 = $expectedHash; version = $version } | ConvertTo-Json | Set-Content windows11-acceptance/poppler.json -Encoding utf8
      - name: Native and managed tests on Windows 11
        shell: pwsh
        run: |
          ./scripts/fetch-deps.ps1
          $env:PDFMETA_WORKER = "$PWD/dist/PdfMetaStudio/pdfmeta-worker.exe"
          $env:PDFMETA_TEST_WORKER = "$PWD/build/native-tools/pdfmeta-test-worker.exe"
          $env:PDFMETA_FILEUTIL_TESTS = "$PWD/build/native-tools/pdfmeta-fileutil-tests.exe"
          $env:QPDF_CLI = "$PWD/build/native-tools/qpdf.exe"
          python worker/tests/run_tests.py $env:PDFMETA_WORKER --corpus worker/external/qpdf/qpdf/qtest/qpdf --report windows11-acceptance/native-worker.json
          if ($LASTEXITCODE) { throw 'Windows 11 native tests failed' }
          dotnet test tests/PdfMetaStudio.Core.Tests -c Release --logger 'trx;LogFileName=core-tests.trx' --results-directory windows11-acceptance
          if ($LASTEXITCODE) { throw 'Windows 11 managed tests failed' }
      - name: Windows 11 install, installed GUI and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Windows 11 keyboard, themes, resizing and large metadata
        timeout-minutes: 12
        shell: pwsh
        run: |
          python scripts/generate-acceptance-fixtures.py build/acceptance-fixtures
          if ($LASTEXITCODE) { throw 'Acceptance fixture generation failed' }
          ./scripts/windows-acceptance.ps1 -Exe "$PWD/dist/PdfMetaStudio/PdfMetaStudio.exe" -Pdf "$PWD/tests/fixtures/rich.pdf" -StressPdf "$PWD/build/acceptance-fixtures/stress.pdf" -OutDir "$PWD/windows11-acceptance/gui" -CalendarChecks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows11-acceptance
          path: |
            windows11-acceptance
            installer-*.log
            installer-smoke
  desktop_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_probe }}
    runs-on: windows-11-arm
    timeout-minutes: 3
    steps:
      - name: Inspect interactive desktop windows
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $windows = [Windows.Automation.AutomationElement]::RootElement.FindAll([Windows.Automation.TreeScope]::Children, [Windows.Automation.Condition]::TrueCondition)
          $records = foreach ($window in $windows) {
            $process = Get-Process -Id $window.Current.ProcessId -ErrorAction SilentlyContinue
            @{ name = $window.Current.Name; className = $window.Current.ClassName; processName = $process.ProcessName; processId = $window.Current.ProcessId; path = $process.Path }
          }
          $records | ConvertTo-Json -Depth 4 | Tee-Object -FilePath desktop-windows.json
          Get-Process | Where-Object { $_.ProcessName -match 'privacy|oobe|experience|wwahost' } | Select-Object ProcessName, Id, Path | ConvertTo-Json | Tee-Object -FilePath desktop-setup-processes.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows11-desktop-probe
          path: desktop-*.json
  gui_acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gui_only }}
    runs-on: windows-11-arm
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report actual Windows product and architecture
        shell: pwsh
        run: Get-ComputerInfo | Select-Object WindowsProductName, OsArchitecture, OsBuildNumber
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Report preinstalled Python for standard-library fixtures
        run: python --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PdfMetaStudio-win-x64
          path: dist/PdfMetaStudio
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
      - name: Rebuild managed GUI and run acceptance
        timeout-minutes: 12
        shell: pwsh
        env:
          GUI_ENGINE_PACKAGE_RUN: ${{ inputs.package_run_id }}
        run: |
          dotnet publish src/PdfMetaStudio.App -c Release -r win-x64 --self-contained true -o dist/PdfMetaStudio
          if ($LASTEXITCODE) { throw 'Managed GUI publication failed' }
          & powershell.exe -NoProfile -File ./scripts/prepare-windows-desktop.ps1 -OutDir windows-acceptance
          if ($LASTEXITCODE) { throw 'Windows 11 desktop preparation failed' }
          & powershell.exe -NoProfile -File ./scripts/windows-host-info.ps1 -OutDir windows-acceptance -Exe "$PWD/dist/PdfMetaStudio/PdfMetaStudio.exe" -RequireWindows11Arm
          if ($LASTEXITCODE) { throw 'Windows 11 ARM host verification failed' }
          python -c "import sys,pathlib; sys.path.insert(0,'worker/tests'); import pdfgen; p=pathlib.Path('build/acceptance-fixtures'); p.mkdir(parents=True,exist_ok=True); (p/'rich.pdf').write_bytes(pdfgen.make_pdf())"
          python scripts/generate-acceptance-fixtures.py build/acceptance-fixtures
          if ($LASTEXITCODE) { throw 'Acceptance fixture generation failed' }
          ./scripts/windows-acceptance.ps1 -Exe "$PWD/dist/PdfMetaStudio/PdfMetaStudio.exe" -Pdf "$PWD/build/acceptance-fixtures/rich.pdf" -StressPdf "$PWD/build/acceptance-fixtures/stress.pdf" -OutDir "$PWD/windows-acceptance" -CalendarChecks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-acceptance
          path: windows-acceptance
  # Релиз: при пуше тега v* или ручном запуске с release_tag архив сборки публикуется как GitHub Release.
  release:
    needs: [build, windows11]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PdfMetaStudio-win-x64
          path: PdfMetaStudio
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PdfMetaStudio-installer-win-x64
          path: installer
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          zip -r -q "PdfMetaStudio-$TAG-win-x64.zip" PdfMetaStudio
          sha256sum installer/*.msi > installer/SHA256SUMS
          sha256sum "PdfMetaStudio-$TAG-win-x64.zip" > "PdfMetaStudio-$TAG-win-x64.zip.sha256"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PDF Meta Studio $TAG" --generate-notes \
            "PdfMetaStudio-$TAG-win-x64.zip" "PdfMetaStudio-$TAG-win-x64.zip.sha256" installer/*.msi installer/SHA256SUMS
